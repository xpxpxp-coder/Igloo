name: Snowman production evidence contracts

on:
  pull_request:
    paths:
      - ".github/workflows/snowman-production-evidence.yml"
      - "docs/snowman/**"
      - "infra/aws/**"
      - "product/**"
      - "scripts/check-snowman-production-boundary.mjs"
      - "scripts/verify-snowman-launch-evidence.mjs"
      - "scripts/test-snowman-launch-evidence.mjs"
      - "scripts/verify-snowman-release-artifacts.mjs"
      - "scripts/test-snowman-release-artifacts.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/snowman-production-evidence.yml"
      - "docs/snowman/**"
      - "infra/aws/**"
      - "product/**"
      - "scripts/check-snowman-production-boundary.mjs"
      - "scripts/verify-snowman-launch-evidence.mjs"
      - "scripts/test-snowman-launch-evidence.mjs"
      - "scripts/verify-snowman-release-artifacts.mjs"
      - "scripts/test-snowman-release-artifacts.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify Snowman production boundary
        run: node scripts/check-snowman-production-boundary.mjs

      - name: Test launch-evidence validator
        run: node scripts/test-snowman-launch-evidence.mjs

      - name: Test immutable release-artifact verifier
        run: node scripts/test-snowman-release-artifacts.mjs

      - name: Verify AWS source contracts
        run: python3 -m unittest discover -s infra/aws/tests -p 'test_*_contract.py'
