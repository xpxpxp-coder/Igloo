apiVersion: v2
name: buzz
description: |
  Snowman Command Center — a governed human and agent operations platform.

  A single relay binary serving WebSocket + REST + web UI, backed by
  PostgreSQL and Redis. Configurable for single-node evaluation
  (subcharts on) and HA production (external services, existingSecret).
type: application
version: 0.1.6
appVersion: "0.1.0"
home: https://github.com/snowman-ai-org/snowman-command-center
sources:
  - https://github.com/snowman-ai-org/snowman-command-center
keywords:
  - nostr
  - relay
  - messaging
  - websocket
  - chat
maintainers:
  - name: Snowman AI
    url: https://snowmanai.org
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Optional READ_DATABASE_URL env (secretKeyRef) enabling relay read-replica routing; absent key preserves prior behavior.
  artifacthub.io/license: Apache-2.0

# Optional eval-only subcharts. Production deploys disable both and point
# externalPostgresql / externalRedis (or secrets.existingSecret) at managed
# services.
dependencies:
  - name: postgres
    version: "0.19.x"
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgresql.enabled
    alias: postgresql
  - name: redis
    version: "0.30.x"
    repository: oci://registry-1.docker.io/cloudpirates
    condition: redis.enabled
